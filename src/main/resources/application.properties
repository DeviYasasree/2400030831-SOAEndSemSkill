spring.application.name=tourist-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tourism_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Existing/pre-generated token used for the assignment.
# Set API_TOKEN in the terminal to the token supplied by your instructor.
app.security.token=${API_TOKEN:VALID_TOKEN_123}

server.port=8080
